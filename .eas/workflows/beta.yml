name: Release Beta

on:
  push:
    tags:
      - "beta/**"

jobs:
  build_android:
    name: Build Android beta
    type: build
    params:
      platform: android
      profile: beta

  build_ios:
    name: Build iOS beta
    type: build
    params:
      platform: ios
      profile: beta

  build_android_apk:
    name: Build Android beta APK
    needs: [build_android]
    type: build
    params:
      platform: android
      profile: beta-apk

  publish_github_release:
    name: Publish APK to GitHub
    needs: [build_android_apk]
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: download_apk
        with:
          build_id: ${{ needs.build_android_apk.outputs.build_id }}
          extensions: [apk]
      - name: Create or update GitHub pre-release
        run: node scripts/publish-github-release.mjs "${{ steps.download_apk.outputs.artifact_path }}" prerelease

  submit_android:
    name: Submit Android to open testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: beta

  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta
