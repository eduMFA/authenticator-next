name: Release Production

on:
  push:
    tags:
      - "v*"

jobs:
  build_android:
    name: Build Android production
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  build_android_apk:
    name: Build Android production APK
    needs: [build_android]
    type: build
    params:
      platform: android
      profile: production-apk

  publish_github_release:
    name: Publish APK to GitHub
    needs: [build_android_apk]
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: download_apk
        with:
          build_id: ${{ needs.build_android_apk.outputs.build_id }}
          extensions: [apk]
      - name: Create or update GitHub release
        run: node scripts/publish-github-release.mjs "${{ steps.download_apk.outputs.artifact_path }}" release

  require_approval:
    name: Approve production submission
    needs: [build_android, build_ios]
    type: require-approval

  submit_android:
    name: Submit Android to Google Play production
    needs: [require_approval, build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [require_approval, build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
